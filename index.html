<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red de ayuda — prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#f6eeda;--ink:#1f2734;--ac:#ef7851;--hi:#fbca46;--card:#fbf8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161c25;--ink:#f6eeda;--ac:#89c590;--card:#262f3f}}
:root[data-theme="dark"]{--bg:#161c25;--ink:#f6eeda;--ac:#89c590;--card:#262f3f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Pixelify Sans',ui-monospace,monospace}
main{max-width:960px;margin:0 auto;padding:12px}
#hud{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 8px;flex-wrap:wrap}
#hud li{flex:1 1 120px;border:2px solid var(--ink);padding:4px 8px;opacity:.55}
#hud li.d{opacity:.85}
#hud li[aria-current]{opacity:1;background:var(--hi);color:#1f2734}
#hud small{display:block;font-size:12px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid var(--ink);touch-action:manipulation}
#box{margin-top:8px;background:var(--card);border:2px solid var(--ink);padding:14px 16px;min-height:160px;font-size:22px;line-height:1.4}
#msg{white-space:pre-line}
button,.btn{font:inherit;text-decoration:none;display:inline-block;color:var(--ink);background:var(--card);border:2px solid var(--ink);padding:6px 12px;margin:8px 8px 0 0;box-shadow:3px 3px 0 var(--ac);cursor:pointer}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--hi)}
img{height:56px;image-rendering:pixelated;vertical-align:middle}
ul{margin:6px 0;padding:0;list-style:none}
.ok{font-weight:700}
</style></head><body><main>
<ol id="hud"></ol>
<canvas id="c" width="640" height="360" role="img" aria-label="Escena del juego"></canvas>
<section id="box"><div id="msg"></div><div id="opts"></div></section>
</main>

const spr=(k,cx,fl,by)=>{const i=I[k];if(!i||!i.width)return;g.save();g.translate(Math.round(cx),by||BY);if(fl)g.scale(-1,1);g.drawImage(i,-Math.round(i.width/2),-i.height);g.restore()};
const hs=(id,k,cx,t,f)=>{const i=I[k];return{id,x:cx-i.width/2,y:BY-i.height,w:i.width,h:i.height,t,f}};
const H=(id,x,y,w,h,t,f,sx,sy)=>({id,x,y,w,h,t,f,sx,sy});
let who=null,sc=0,done={},lastT='',P={x:72,d:1,tx:null,cb:null},band={x:588,tx:null,v:0,fl:false,cb:null};

const AO=()=>[{t:'Al Centro de Salud Animal',f:ok1},{t:'A una protectora del barrio',f:ok1},{t:'Espero unos días a ver si mejora',f:()=>say('Esperar suma días sin agua ni atención. Volvé a decidir.',AO())}];
function ok1(){say('Avisaste a tiempo y se coordina el traslado: Milo y Cometa salen hacia la veterinaria. Primer eslabón: avisar y trasladar.',[{t:'Seguir',f:next}])}
const dest=(k,n)=>()=>{const T={m:{t:'Milo ya está listo para ser recibido por una familia. Volvé a decidir.',a:'Milo está listo para ser recibido por una familia.'},c:{t:'A Cometa todavía le falta una parte del recorrido: un hogar de tránsito lo cuida mientras tanto. Es un tramo, no un final.',a:'A Cometa todavía le falta una parte del recorrido. Volvé a decidir.'}}[k];const opts=()=>[{t:'Hogar de tránsito',f:()=>k==='c'?pick(k,T.t):say(T.t,opts())},{t:'Publicar para adopción',f:()=>k==='m'?pick(k,T.a):say(T.a,opts())}];say('¿Qué camino para '+n+'?',opts())};
function pick(k,t){done['3'+k]=1;say(t,done['3m']&&done['3c']?[{t:'Ver el mapa',f:fin}]:[])}
function bandida(){const o=[{t:'Acercarte rápido para tocarla',f:()=>{say('Se asustó y salió corriendo. Los movimientos bruscos cortan la confianza.');band.fl=false;band.v=320;band.tx=720;band.cb=()=>{band.cb=null;setTimeout(()=>{band.fl=true;band.v=140;band.tx=575},1000)}}},
{t:'Llamar al centro para llevarla',f:()=>say('Bandida está sana, conoce su zona y la red de vecinos la cuida. Nadie le pidió ser rescatada. Observá un poco más antes de decidir.',o)},
{t:'Dejar comida y agua, y alejarte',f:()=>{P.tx=380;P.cb=null;say('Dejás el plato y te sentás lejos. Esperás.');band.fl=true;band.v=45;band.tx=250;band.cb=()=>{band.cb=null;done['2b']=1;say('Se acercó cuando le diste espacio: comió, tomó agua y se quedó cerca. No hizo falta llevársela. Respetarla también es ayudar. Tercer eslabón: respetar.',[{t:'Seguir',f:next}])}}}];
say('Bandida está sentada, atenta, a unos metros. ¿Qué hacés?',o)}

const bgf=i=>()=>g.drawImage(B[i],0,0);
const SC=[
{n:'La casa',e:'Avisar y trasladar',bg:bgf(0),intro:'Un vecino avisó por una casa con patio. Mirá con atención antes de decidir. Tocá los puntos marcados.',
 npc:()=>[],
 hot:()=>[H('a',290,268,38,28,'El plato de agua está seco. Hace rato que nadie lo llena.',null,309,237),H('b',128,182,96,78,'Una cucha para uno solo, y acá hay una camada. No hay golpes a la vista: hay descuido y poco espacio.',null,177,157),H('c',237,200,143,76,'Milo y Cometa están tranquilos, pegados entre sí. Pero casi no tienen agua ni sombra.',null,311,157)],
 chk(){if(['a','b','c'].every(k=>done['0'+k])&&!done.q){done.q=1;say(lastT+'\n\nYa viste lo suficiente. ¿A quién avisás?',AO())}}},
{n:'Veterinaria amiga',e:'Atender',bg:bgf(1),intro:'Milo y Cometa llegaron a la veterinaria amiga. Recorré el lugar: cada rincón es parte del cuidado.',
 npc:()=>[],
 hot:()=>[H('v',30,52,176,214,'Vacunas y desparasitación: lo primero que reciben al llegar, antes de cualquier tránsito.',null,181,70),H('c',247,69,106,58,'Castración: previene camadas sin hogar y también cuida la salud del animal.',null,300,52),H('w',386,110,86,78,null,()=>{done['1w']=1;say('En la compu está el mapa de cuidados por etapa, veterinarias y centros de la ciudad. Todo eso vive en el webdoc.',[{t:'Abrir el webdoc',href:WD}])},428,90),H('f',541,140,55,56,'Ficha de Bandida: la atienden acá sin cobrarle. Retira su comida y vuelve a la calle por su cuenta. La última vez la vieron en una esquina con kiosco.',null,568,123)],
 chk(){if(['v','c','w','f'].every(k=>done['1'+k])&&!done.q2){done.q2=1;say(lastT+'\n\nMilo y Cometa quedan atendidos. Segundo eslabón: atender.',[{t:'Seguir',f:next}])}}},
{n:'La esquina',e:'Respetar',bg:bgf(2),intro:'La ficha de Bandida te trajo hasta esta esquina. Ella no espera que la salven. Observá antes de actuar.',
 npc:()=>[[band.tx!=null?'bandS':'bandF',band.x,band.tx!=null&&band.fl,303]],
 hot:()=>{const i=I[band.tx!=null?'bandS':'bandF'];return[H('fl',478,209,58,100,'Flaco: “Bandida es mi mejor amiga. Aparece, mira cómo estoy y se va cuando quiere. Así es ella.”',null,507,179),{id:'b',x:band.x-i.width/2,y:303-i.height,w:i.width,h:i.height,f:bandida,sx:band.x,sy:193},H('k',311,268,34,36,'Un plato de agua frente al kiosco. Nadie lo mira, pero se renueva todos los días.',null,328,264),H('p',177,93,119,207,'Una plaza con sombra, canilla y vecinos que la conocen. Otro lugar amigable.',null,236,65)]}},
{n:'El centro',e:'Tránsito y adopción',bg:bgf(3),intro:'De vuelta en el Centro de Salud Animal. Limón da la bienvenida a los recién llegados. Ahora hay que decidir qué camino sigue cada uno.',
 npc:()=>[],
 hot:()=>[H('b',210,215,56,88,'Bandida come tranquila afuera. Elige su camino, pero sabe dónde hay un plato y una puerta amiga.',null,230,190),H('l',303,218,58,86,'Limón: “Bienvenidos. Nadie llega igual ni se va igual: algunos esperan tránsito, otros hogar. Todos pasan por acá.”',null,323,190),H('v',372,216,58,88,'Vampi: “De noche patrullo el barrio. Bandida pasa por la puerta, come y sigue su camino. No entra, y está bien.”',null,392,192),H('m',520,218,48,86,null,dest('m','Milo'),545,194),H('c',571,218,44,86,null,dest('c','Cometa'),595,195)]}];

function say(t,b){lastT=t;$('msg').textContent=t;$('opts').replaceChildren(...(b||[]).map(o=>{let e;if(o.href){e=document.createElement('a');e.href=o.href;e.target='_blank';e.rel='noopener';e.className='btn'}else{e=document.createElement('button');e.onclick=o.f}e.textContent=o.t;return e}))}
function hud(){$('hud').innerHTML=SC.map((s,i)=>'<li'+(who&&i==sc?' aria-current="step"':'')+(who&&i<sc?' class="d"':'')+'>'+(!who||i>sc?'???':s.n)+'<small>'+(!who||i>sc?'???':s.e)+'</small></li>').join('')}
function go(i){sc=i;BY=BYS[i];P.x=72;P.tx=null;P.cb=null;P.tok=null;band={x:588,tx:null,v:0,fl:false,cb:null};hud();say(SC[i].intro)}
const next=()=>go(sc+1);
function visit(h){if(!h.f)done[sc+h.id]=1;if(h.f)h.f();else say(h.t);if(SC[sc].chk)SC[sc].chk()}
function fin(){const L=[['Veterinaria amiga',1],['Kiosco con plato de agua',done['2k']],['Plaza con sombra y agua',done['2p']],['Centro de Salud Animal',1]];
$('msg').innerHTML='<img alt="Bandida" src="'+SP.bandF+'" style="float:right;height:74px;margin:0 0 8px 12px"><b>Los eslabones de la red</b><ul><li class="ok">✓ Avisar y trasladar: dar aviso a tiempo y coordinar el traslado.</li><li class="ok">✓ Atender: vacunas, desparasitación y castración en una veterinaria amiga.</li><li class="ok">✓ Respetar: observar y dar espacio, porque no todo animal en la calle pide ser rescatado.</li><li class="ok">✓ Tránsito y adopción: un hogar de tránsito cuida hasta que aparezca el definitivo.</li></ul><p><b>Conocé la historia de cada uno.</b> Milo, Cometa, Flaco, Limón, Vampi y Bandida tienen la suya en el cómic. Conseguilo en la librería más cercana.</p>';
$('opts').replaceChildren();const b=document.createElement('button');b.textContent='Jugar de nuevo';b.onclick=()=>{done={};start()};$('opts').appendChild(b);const a=document.createElement('a');a.className='btn';a.href=WD;a.target='_blank';a.rel='noopener';a.textContent='Abrir el webdoc';$('opts').appendChild(a)}
function start(){who=null;sc=0;BY=BYS[0];band={x:588,tx:null,v:0,fl:false,cb:null};hud();$('msg').innerHTML='<b>Red de ayuda</b>: prototipo jugable. Elegí a quién guiar. Después tocá el escenario para caminar y los puntos marcados para observar.';
const o=$('opts');o.replaceChildren();[['boy','Sergio'],['girl','Milagros']].forEach(([k,n])=>{const b=document.createElement('button');b.innerHTML='<img alt="" src="'+SP[k+'F']+'"> '+n;b.onclick=()=>{who=k;go(0)};o.appendChild(b)})}

cv.addEventListener('pointerdown',e=>{if(!who)return;const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*640/r.width,my=(e.clientY-r.top)*360/r.height;
const h=SC[sc].hot().find(h=>(mx>=h.x&&mx<=h.x+h.w&&my>=h.y-22&&my<=h.y+h.h)||(h.sx!=null&&Math.abs(mx-h.sx)<18&&Math.abs(my-h.sy)<18));
if(h){const cx=h.x+h.w/2;P.tx=Math.max(30,Math.min(610,cx+(P.x<cx?-1:1)*(h.w/2+22)));const k={};P.tok=k;const fire=()=>{if(P.tok===k){P.tok=null;visit(h)}};P.cb=fire;setTimeout(fire,4000)}else{P.tok=null;P.tx=Math.max(30,Math.min(610,mx));P.cb=null}});

let last=0;
function loop(t){let dt=(t-last)/1000;if(!(dt>0))dt=.016;dt=Math.min(.05,dt);last=t;
if(P.tx!=null){const d=P.tx-P.x;if(Math.abs(d)<2){P.x=P.tx;P.tx=null;const cb=P.cb;P.cb=null;if(cb)cb()}else{P.d=d>0?1:-1;P.x+=P.d*Math.min(Math.abs(d),130*dt)}}
if(band.tx!=null){const d=band.tx-band.x;if(Math.abs(d)<2){band.x=band.tx;band.tx=null;if(band.cb)band.cb()}else band.x+=Math.sign(d)*Math.min(Math.abs(d),band.v*dt)}
g.clearRect(0,0,640,360);const s=SC[sc];s.bg();s.npc().forEach(n=>spr(n[0],n[1],n[2]));
if(who)spr(who+'S',P.x,P.d<0);
if(who)s.hot().forEach(h=>{if(done[sc+h.id]||h.sx==null||!I.star.width)return;g.drawImage(I.star,Math.round(h.sx-14),Math.round(h.sy-14+Math.sin(t/300)*2))});
requestAnimationFrame(loop)}
start();requestAnimationFrame(loop);
</script></body></html>
